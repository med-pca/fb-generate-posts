<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Modérateur · PostFlow</h1>
  <p class="hint">Désigné <b>modérateur</b> sur la plateforme, et <b>administrateur ou modérateur des groupes</b> sur Facebook.</p>

  <div id="state" class="state">—</div>
  <div class="row">
    <button id="toggle" class="primary">Activer le mode automatique</button>
  </div>

  <!-- Une section par mission, construite par popup.js (MISSIONS). -->
  <div id="missions"></div>

  <details id="setup">
    <summary>Réglages</summary>
    <label>Plateforme <input id="apiBase" type="url" placeholder="https://post.pulserecipe.com"></label>
    <label>Clé d’API <small>(X-API-Key)</small> <input id="apiKey" type="password" autocomplete="off"></label>
    <label>Identifiant NSTBrowser de CE profil <small>(sous son nom, rubrique Modérateurs)</small> <input id="profileExternalId" type="text" autocomplete="off"></label>
    <button id="save" class="secondary">Enregistrer</button>
  </details>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>

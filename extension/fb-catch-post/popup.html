<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Reprendre une publication</h1>

    <section id="picker" class="hidden">
      <label>Quelle publication ?</label>
      <ul id="posts"></ul>
    </section>

    <section id="capture" class="hidden">
      <img id="preview" alt="" />
      <label for="caption">Texte de la publication <small>repart à l'identique</small></label>
      <textarea id="caption" rows="5"></textarea>
    </section>

    <label for="source">URL de l'article à réécrire</label>
    <input id="source" type="url" placeholder="https://exemple.com/la-recette" />

    <button id="send" disabled>Envoyer</button>
    <p id="status" role="status"></p>
    <p id="done" class="hidden"></p>
  </body>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</html>
